name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # NEXT_PUBLIC_* values are inlined into the bundle at build time
          NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
          NEXT_PUBLIC_UMAMI_ANALYTICS_URL: ${{ vars.NEXT_PUBLIC_UMAMI_ANALYTICS_URL }}

      - name: Assemble release
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          cp ecosystem.config.js .next/standalone/

      - name: Smoke test
        working-directory: .next/standalone
        run: |
          node -e "require('sharp')({ create: { width: 1, height: 1, channels: 3, background: '#000' } }).png().toBuffer().then(() => console.log('sharp ok'))"

          PORT=3100 HOSTNAME=127.0.0.1 node server.js > "$RUNNER_TEMP/smoke.log" 2>&1 &
          SERVER_PID=$!

          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3100/; then
              echo "server ok"
              kill "$SERVER_PID"
              exit 0
            fi
            sleep 1
          done

          cat "$RUNNER_TEMP/smoke.log"
          exit 1

      - name: Package release
        run: tar -czf release.tgz -C .next/standalone .

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release.tgz
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy to production
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://adigsi.id
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      LEGACY_PM2_NAME: ${{ vars.LEGACY_PM2_NAME }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/deploy

      - uses: actions/download-artifact@v8
        with:
          name: release

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts

          # Secrets pasted in the GitHub UI can carry stray spaces or newlines
          HOST="$(printf '%s' "$SSH_HOST" | tr -d '[:space:]')"
          USER_NAME="$(printf '%s' "$SSH_USER" | tr -d '[:space:]')"
          echo "SSH_TARGET=$USER_NAME@$HOST" >> "$GITHUB_ENV"

          KNOWN_HOST="$HOST"
          [ "$SSH_PORT" != "22" ] && KNOWN_HOST="[$HOST]:$SSH_PORT"
          if ! ssh-keygen -F "$KNOWN_HOST" -f ~/.ssh/known_hosts >/dev/null; then
            echo "SSH_HOST is ${#SSH_HOST} characters (${#HOST} after trimming whitespace)"
            echo "Hosts found in SSH_KNOWN_HOSTS:"
            awk 'NF >= 3 && $1 !~ /^#/ { print "  " $1 " (" $2 ")" }' ~/.ssh/known_hosts
            echo "::error::SSH_KNOWN_HOSTS has no entry for SSH_HOST. Both must use the same host (IP vs domain). Regenerate with: ssh-keyscan -p $SSH_PORT <SSH_HOST>"
            exit 1
          fi

      - name: Upload release
        run: |
          RELEASE_ID="$(date -u +%Y%m%dT%H%M%S)-${GITHUB_SHA::7}"
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"

          SSH_OPTS=(-i ~/.ssh/deploy_key -o BatchMode=yes -o ServerAliveInterval=30)
          scp "${SSH_OPTS[@]}" -P "$SSH_PORT" release.tgz "$SSH_TARGET:/tmp/adigsi-release-$RELEASE_ID.tgz"
          scp "${SSH_OPTS[@]}" -P "$SSH_PORT" scripts/deploy/activate-release.sh "$SSH_TARGET:/tmp/adigsi-activate-release.sh"

      - name: Activate release
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ServerAliveInterval=30 -p "$SSH_PORT" "$SSH_TARGET" \
            "LEGACY_PM2_NAME='$LEGACY_PM2_NAME' bash /tmp/adigsi-activate-release.sh '$RELEASE_ID' '/tmp/adigsi-release-$RELEASE_ID.tgz'"
